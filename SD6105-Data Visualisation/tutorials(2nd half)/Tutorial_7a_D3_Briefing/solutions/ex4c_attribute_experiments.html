/*
 * Exercise (Demo 4): "Try to change the circle attributes (e.g., fill-opacity,
 * radius, stroke-width, cx, cy) and see what happens".
 *   fill-opacity 0.85 -> 0.4 : marks become translucent (overlaps visible)
 *   r            5    -> 12  : bigger marks (more salient, more overlap)
 *   stroke-width 0    -> 2px : an outline appears (stroke colour = black)
 *   cx           +60  -> +100: every mark moves 40 px to the right
 *   cy           uses a different scale factor -> vertical positions change
 * Because the attributes are set with functions of (d, i), every circle
 * receives its own value computed from ITS bound datum.
 */
function makeChart(data){

  d3.select(".chart").style("width", chartWidth).style("height", chartHeight);

  var enter = d3.select(".chart").selectAll("circle")
      .data(data)
      .enter().append("circle")
      .attr("fill", "steelblue")
      .attr("fill-opacity", 0.4)
      .attr("r", 12)
      .attr("stroke", "black")
      .attr("stroke-width", "2px");

  enter.append("svg:title").text(function(d){ return d.name; });

  enter.attr("cx", function(d,i){ return (300*i/sampleData.length) + 100; })
       .attr("cy", function(d){ return 400 - d.age * 12; });
}

makeChart(sampleData);
