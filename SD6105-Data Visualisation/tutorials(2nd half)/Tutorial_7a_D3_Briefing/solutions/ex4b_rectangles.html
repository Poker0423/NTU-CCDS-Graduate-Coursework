/*
 * Exercise (Demo 4): "By revising the code of Demo 4, try to draw rectangles
 * instead of circles!"
 * Changes vs 4-binding.html:
 *   - selectAll("rect") / append("rect")  instead of "circle"
 *   - a rect is positioned by its TOP-LEFT corner (x, y) and has width/height,
 *     whereas a circle uses its centre (cx, cy) and radius r. To keep the marks
 *     centred on the same positions we subtract half of the size.
 */
var size = 10;

function makeChart(data){

  var canvas = d3.select(".chart")
      .style("width", chartWidth)
      .style("height", chartHeight);

  var scatter = d3.select(".chart")
      .selectAll("rect")
      .data(data);

  // ENTER
  var enter = scatter.enter().append("rect")
      .attr("fill-opacity", 0.85)
      .attr("width", size)
      .attr("height", size)
      .attr("stroke-width", "0px");

  // Add a title to the mark (on mouseover)
  enter.append("svg:title")
      .text(function(d){ return d.name; });

  // Top-left corner = centre - size/2
  enter.attr("x", function(d,i){ return (380*i/sampleData.length) + 60 - size/2; })
       .attr("y", function(d){ return 465-((d.age-2.5)*(430/27.5)) - size/2; });
}

makeChart(sampleData);
