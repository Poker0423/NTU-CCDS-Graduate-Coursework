<html>

<meta charset="utf-8" />
<head>
<title>D3 Example</title>
<style>
h1 { 
  font-family: sans-serif;
  text-align: center;
}

.chart{
  font-size: 10px;
  text-align: right;
  color: white;
  margin-left: 800px;
}

</style>
<script src="https://d3js.org/d3.v7.min.js" charset="utf-8"></script>
</head>

<body>
<h1>A Bar Chart Using DOM Div</h1>

<div class="chart"></div>

<script>
/********
 * Data *
 ********/
var data = [4, 8, 15];

/********
 * Draw the bar chart *
 ********/
 d3.select(".chart")
    .selectAll('div')
    .data(data)
    .join("div")
      .style("background", "steelblue")
      .style("padding", "3px")
      .style("margin", "1px")
      .style("width", function(d) {
        return '' + (d * 10) + 'px';
      })
      .style('height', '20px')
      .text(function(d){
        return d;
      });
</script>
</body>
</html>
