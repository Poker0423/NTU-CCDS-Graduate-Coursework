<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>From Grid to Glory - Title Card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="title-page">
  <main class="frame">
    <div class="track-lines" aria-hidden="true"></div>
    <section class="title-content">
      <p class="course" data-course>SD6105 Data Visualisation</p>
      <p class="eyebrow">Formula 1 · Grid position · Comeback</p>
      <h1>From Grid<br><span>to Glory</span></h1>
      <p class="question">Does starting position guarantee victory in Formula 1?</p>
      <div class="presenters" aria-label="Presenters">
        <div><span>Presenter A</span><strong data-presenter-a>Presenter A</strong></div>
        <i aria-hidden="true"></i>
        <div><span>Presenter B</span><strong data-presenter-b>Presenter B</strong></div>
      </div>
    </section>
    <div class="lap-mark" aria-hidden="true"><span>01</span><small>THE QUESTION</small></div>
  </main>
  <script src="config.js"></script>
  <script src="cards.js"></script>
</body>
</html>
