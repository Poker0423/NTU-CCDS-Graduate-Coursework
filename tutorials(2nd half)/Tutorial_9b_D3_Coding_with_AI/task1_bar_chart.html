<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Task 1b - AAPL quarterly average close (interactive bar chart)</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin: 24px; color: #333; }
  h2 { margin: 0 0 4px; font-weight: 600; }
  p { margin: 0 0 10px; color: #777; font-size: 13px; }
  .controls button { font: inherit; font-size: 12px; padding: 5px 12px; margin-right: 4px; cursor: pointer;
                     border: 1px solid #4682b4; background: #fff; color: #4682b4; border-radius: 3px; }
  .controls button.active { background: #4682b4; color: #fff; }
  .bar { fill: steelblue; }
  .bar:hover { fill: #e6550d; }
  .tooltip { position: absolute; pointer-events: none; background: rgba(30,30,30,.9); color: #fff;
             padding: 6px 9px; border-radius: 4px; font-size: 12px; opacity: 0; line-height: 1.4; }
  .axis text { font-size: 10px; }
</style>
</head>
<body>
<h2>Apple (AAPL) average closing price per quarter</h2>
<p>Hover a bar for details &middot; use the buttons to sort (bars animate to their new positions).</p>
<div class="controls">
  <button data-sort="time" class="active">Timeline</button>
  <button data-sort="asc">Ascending</button>
  <button data-sort="desc">Descending</button>
</div>
<div id="chart"></div>
<div class="tooltip" id="tip"></div>
<script>
/* Task 1 (part 2): interactive + animated bar chart of the closing price.
   - Aggregate the 1,260 daily rows to quarters (average close) -> 21 bars.
   - Enter animation: bars grow from the x-axis (staggered).
   - Tooltip on mouseover (quarter, average/min/max close, #trading days).
   - Sorting: re-compute the x band scale domain and TRANSITION every bar (keyed
     by quarter, so each bar keeps representing the same quarter = object
     constancy / congruence principle) and the axis labels. */
const margin = {top: 20, right: 20, bottom: 70, left: 60};
const width = 960 - margin.left - margin.right, height = 440 - margin.top - margin.bottom;
const svg = d3.select("#chart").append("svg")
    .attr("width", width + margin.left + margin.right)
    .attr("height", height + margin.top + margin.bottom)
  .append("g").attr("transform", `translate(${margin.left},${margin.top})`);
const tip = d3.select("#tip");

d3.csv("data/aapl.csv", d => ({date: d3.timeParse("%Y-%m-%d")(d.Date), close: +d.Close})).then(raw => {
  const data = d3.rollups(raw, v => ({
        avg: d3.mean(v, d => d.close), min: d3.min(v, d => d.close),
        max: d3.max(v, d => d.close), n: v.length, start: d3.min(v, d => d.date)}),
      d => `${d.date.getFullYear()} Q${Math.floor(d.date.getMonth() / 3) + 1}`)
    .map(([quarter, s]) => ({quarter, ...s}))
    .sort((a, b) => a.start - b.start);

  const x = d3.scaleBand().domain(data.map(d => d.quarter)).range([0, width]).padding(0.15);
  const y = d3.scaleLinear().domain([0, d3.max(data, d => d.avg)]).nice().range([height, 0]);

  const xAxis = svg.append("g").attr("class", "axis").attr("transform", `translate(0,${height})`);
  const drawX = (t) => xAxis.transition(t).call(d3.axisBottom(x))
      .selectAll("text").attr("transform", "rotate(-45)").style("text-anchor", "end")
      .attr("dx", "-0.5em").attr("dy", "0.3em");
  drawX(d3.transition().duration(0));
  svg.append("g").attr("class", "axis").call(d3.axisLeft(y).tickFormat(d => "$" + d));
  svg.append("text").attr("x", -height / 2).attr("y", -45).attr("transform", "rotate(-90)")
     .attr("text-anchor", "middle").attr("font-size", 12).text("Average closing price (USD)");
  svg.append("text").attr("x", width / 2).attr("y", height + 62).attr("text-anchor", "middle")
     .attr("font-size", 12).text("Quarter");

  svg.selectAll(".bar").data(data, d => d.quarter).join("rect")
      .attr("class", "bar")
      .attr("x", d => x(d.quarter)).attr("width", x.bandwidth())
      .attr("y", height).attr("height", 0)
      .on("mouseover", () => tip.style("opacity", 1))
      .on("mousemove", (event, d) => tip
         .html(`<b>${d.quarter}</b><br>Average close: $${d.avg.toFixed(2)}<br>` +
               `Range: $${d.min.toFixed(2)} - $${d.max.toFixed(2)}<br>${d.n} trading days`)
         .style("left", (event.pageX + 12) + "px").style("top", (event.pageY - 30) + "px"))
      .on("mouseout", () => tip.style("opacity", 0))
    .transition().duration(800).delay((d, i) => i * 40)
      .attr("y", d => y(d.avg)).attr("height", d => height - y(d.avg));

  d3.selectAll(".controls button").on("click", function () {
    d3.selectAll(".controls button").classed("active", false);
    d3.select(this).classed("active", true);
    const mode = this.dataset.sort;
    const sorted = data.slice().sort(
      mode === "asc" ? (a, b) => a.avg - b.avg :
      mode === "desc" ? (a, b) => b.avg - a.avg : (a, b) => a.start - b.start);
    x.domain(sorted.map(d => d.quarter));
    const t = d3.transition().duration(750);
    svg.selectAll(".bar").transition(t).delay((d, i) => i * 20).attr("x", d => x(d.quarter));
    drawX(t);
  });
}).catch(err => d3.select("#chart").append("p").style("color", "red")
     .text("Could not load data/aapl.csv - start a local server: python -m http.server 8000 (" + err + ")"));
</script>
</body>
</html>
