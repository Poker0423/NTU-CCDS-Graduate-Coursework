<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Exercise 5 - scale experiments</title>
<style>
h1 { font-family: sans-serif; text-align: center; }
p.note { font-family: sans-serif; text-align: center; color: #555; font-size: 13px; }
svg { display: block; margin-left: auto; margin-right: auto; border: 1px solid black; }
svg text { font-size: 11px; font-family: sans-serif; }
</style>
<script src="https://d3js.org/d3.v7.min.js" charset="utf-8"></script>
</head>
<body>
<h1>Demo 5/6 revised: scales</h1>
<p class="note">x = passenger index, y = age, fill = sex, stroke = survived (2px), radius &prop; sqrt(fare)</p>
<svg class="chart"></svg>
<script>
var chartWidth = 500;
var chartHeight = 500;

var sampleData = [
            {
            "pclass": 1,
            "survived": 1,
            "name": "Allen, Miss. Elisabeth Walton",
            "sex": "female",
            "age": 29,
            "sibsp": 0,
            "parch": 0,
            "ticket": 24160,
            "fare": 211.3375,
            "cabin": "B5",
            "embarked": "S",
            "boat": 2,
            "body": 0,
            "home.dest": "St Louis, MO"
            },
            {
            "pclass": 1,
            "survived": 1,
            "name": "Allison, Master. Hudson Trevor",
            "sex": "male",
            "age": 0.92,
            "sibsp": 1,
            "parch": 2,
            "ticket": 113781,
            "fare": 151.55,
            "cabin": "C22 C26",
            "embarked": "S",
            "boat": 11,
            "body": 0,
            "home.dest": "Montreal, PQ / Chesterville, ON"
            },
            {
            "pclass": 1,
            "survived": 0,
            "name": "Allison, Miss. Helen Loraine",
            "sex": "female",
            "age": 2,
            "sibsp": 1,
            "parch": 2,
            "ticket": 113781,
            "fare": 151.55,
            "cabin": "C22 C26",
            "embarked": "S",
            "boat": 0,
            "body": 0,
            "home.dest": "Montreal, PQ / Chesterville, ON"
            },
            {
            "pclass": 1,
            "survived": 0,
            "name": "Allison, Mr. Hudson Joshua Creighton",
            "sex": "male",
            "age": 30,
            "sibsp": 1,
            "parch": 2,
            "ticket": 113781,
            "fare": 151.55,
            "cabin": "C22 C26",
            "embarked": "S",
            "boat": 0,
            "body": 135,
            "home.dest": "Montreal, PQ / Chesterville, ON"
            },
            {
            "pclass": 1,
            "survived": 0,
            "name": "Allison, Mrs. Hudson J C (Bessie Waldo Daniels)",
            "sex": "female",
            "age": 25,
            "sibsp": 1,
            "parch": 2,
            "ticket": 113781,
            "fare": 151.55,
            "cabin": "C22 C26",
            "embarked": "S",
            "boat": 0,
            "body": 0,
            "home.dest": "Montreal, PQ / Chesterville, ON"
            }
            ];

/*
 * Experiments from the "Scales" section:
 *  1) "Try to change the stroke-width to a non-zero value"
 *     -> stroke-width 2.5px. NOTE a subtle bug in 6-scales2.html: the stroke
 *        scale has domain ["0","1"] (strings) but d.survived is a NUMBER.
 *        d3.scaleOrdinal compares keys with ===, so 0 and 1 are unknown values,
 *        get appended to the domain implicitly and are mapped by position:
 *        survivors end up RED and victims BLUE - the opposite of the intent.
 *        Fix: use String(d.survived) (or a numeric domain [0, 1]).
 *  2) "Try to change the scale of x position, y position, fill colour,
 *      stroke colour" -> y uses a 0-based domain + .nice(); fill uses a
 *     different categorical palette; stroke uses green/red for survived/died.
 *  3) "Set the radius proportional to fare instead of always 5px"
 *     -> d3.scaleSqrt so that circle AREA (what we perceive) is proportional
 *        to fare (a linear radius would exaggerate large fares quadratically).
 */
var x, y, c, s, r;

function makeChart(data){

  // y position: start at 0 and round the domain
  y = d3.scaleLinear()
      .domain([0, d3.max(data, function(d){ return d.age; })]).nice()
      .range([465, 35]);

  // x position
  x = d3.scaleLinear()
      .domain([0, data.length - 1])
      .range([115, 430]);

  // fill colour by sex (new palette)
  c = d3.scaleOrdinal()
      .domain(["male", "female"])
      .range(["#1f78b4", "#e7298a"]);

  // stroke colour by survival - keys as STRINGS (see bug note above)
  s = d3.scaleOrdinal()
      .domain(["0", "1"])
      .range(["#e31a1c", "#33a02c"]);   // died = red, survived = green

  // radius: area proportional to fare
  r = d3.scaleSqrt()
      .domain([0, d3.max(data, function(d){ return d.fare; })])
      .range([0, 28]);

  var svg = d3.select(".chart").style("width", chartWidth).style("height", chartHeight);

  var enter = svg.selectAll("circle").data(data).enter().append("circle")
      .attr("fill-opacity", 0.6)
      .attr("stroke-width", "2.5px")
      .attr("r", function(d){ return r(d.fare); });

  enter.append("svg:title")
      .text(function(d){ return d.name + " | age " + d.age + " | fare " + d.fare +
                                " | " + (d.survived ? "survived" : "died"); });

  enter.attr("cx", function(d,i){ return x(i); })
       .attr("cy", function(d){ return y(d.age); })
       .attr("fill", function(d){ return c(d.sex); })
       .attr("stroke", function(d){ return s(String(d.survived)); });

  // axis + small legend so the encodings can be read
  svg.append("g").attr("transform", "translate(60,0)").call(d3.axisLeft(y));
  svg.append("text").attr("x", 20).attr("y", 20).text("Age");
  var leg = [["female (fill)", "#e7298a", null], ["male (fill)", "#1f78b4", null],
             ["survived (stroke)", "white", "#33a02c"], ["died (stroke)", "white", "#e31a1c"]];
  var lg = svg.append("g").attr("transform", "translate(330,340)");
  leg.forEach(function(l, i){
    lg.append("circle").attr("cx", 0).attr("cy", i*16).attr("r", 5)
      .attr("fill", l[1]).attr("stroke", l[2] || "none").attr("stroke-width", 2);
    lg.append("text").attr("x", 10).attr("y", i*16 + 4).text(l[0]);
  });
}

makeChart(sampleData);
</script>
</body>
</html>
